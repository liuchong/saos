name: Test

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The browser tests launch Chromium. playwright-core drives a browser it
      # does not download, so the runner has to install one.
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Build through the local Action
        uses: ./
        with:
          content: examples/basic/content/blog
          config: examples/basic/saos.config.mjs
          public: examples/basic/static
          output: .saos-action-test
      - name: Verify generated output
        shell: bash
        run: test -f .saos-action-test/index.html
